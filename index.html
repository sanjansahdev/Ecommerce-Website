
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Online Store</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>🛒 ShopEasy</h1>
    <p>Your Favorite Online Shopping Store</p>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Cart</a>
  </nav>

  <main id="home">
    <section class="hero">
      <h2>Discover Amazing Products</h2>
      <p>Shop the latest technology at great prices.</p>
    </section>

    <section id="products">
      <h2>Our Products</h2>
      <input type="text" id="search"
        placeholder="Search products...">
      <div id="productList" class="products"></div>
    </section>

    <section id="cart" class="cart">
      <h2>Shopping Cart 🛒</h2>
      <div id="cartItems">Your cart is empty.</div>
      <h3 id="total">Total: ₹0</h3>
      <button id="checkout">Checkout</button>
    </section>
  </main>

  <footer>
    <p>© 2026 ShopEasy | E-Commerce Project</p>
  </footer>
</body>
</html>
